[workspace]
resolver = "3"
members = [
    "crates/daw-contracts",
    "crates/daw-transport",
    "crates/daw-metronome",
    "crates/daw-engine",
    "crates/daw-drums",
    "crates/daw-patterns",
    "crates/daw-demo",
    "crates/daw-sampler",
    "crates/daw-synth",
    "crates/daw-strings",
    "crates/daw-samples",
    "crates/daw-stretch",
    "crates/daw-effects",
    "crates/daw-note-effects",
    "crates/daw-catalog",
    "crates/daw-project",
    "crates/daw-persistence",
    "crates/daw-render",
    "crates/daw-mixcheck",
    "crates/daw-summary",
    "crates/daw-midi",
    "crates/daw-recorder",
    "crates/daw-automation-writer",
    "crates/daw-audio-recorder",
    "crates/daw-bootstrap",
    "crates/daw-audio-cpal",
    "crates/daw-vst3",
    "crates/daw-rpc",
    "crates/daw-app",
    "crates/daw-mcp",
    "app/src-tauri",
]

[workspace.package]
edition = "2024"
version = "0.1.0-beta.1"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
chunks_exact_to_as_chunks = "allow"
needless_range_loop = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
pedantic = { level = "warn", priority = -1 }
# Шум для звукового кода и публичных контрактов: числа в DSP приводятся осознанно, документация ошибок и must_use не нужны.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
doc_markdown = "allow"
float_cmp = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
wildcard_imports = "allow"
items_after_statements = "allow"
unreadable_literal = "allow"
assert_is_empty = "allow"
default_trait_access = "allow"
struct_field_names = "allow"

# The crates that make the sound (the audio thread, the instruments and effects, rendering and the loudness meter) are
# optimized in the dev profile too: unoptimized DSP runs 10–30 times slower, so `tauri dev` overloaded the audio
# thread on a real project (AU-443, the sound breaks up). Only these crates build slower; the rest of a dev build,
# daw-contracts included, keeps its debug speed and checks.
[profile.dev.package.daw-engine]
opt-level = 3
[profile.dev.package.daw-effects]
opt-level = 3
[profile.dev.package.daw-synth]
opt-level = 3
[profile.dev.package.daw-strings]
opt-level = 3
[profile.dev.package.daw-sampler]
opt-level = 3
[profile.dev.package.daw-drums]
opt-level = 3
[profile.dev.package.daw-metronome]
opt-level = 3
[profile.dev.package.daw-note-effects]
opt-level = 3
[profile.dev.package.daw-stretch]
opt-level = 3
[profile.dev.package.daw-render]
opt-level = 3
[profile.dev.package.daw-audio-cpal]
opt-level = 3
